name: Low-Poly 3D Video Render

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            blender \
            ffmpeg \
            libegl1 \
            libgl1 \
            libgles2 \
            libx11-6 \
            libxext6 \
            libxfixes3 \
            libxi6 \
            libxrender1 \
            libxkbcommon0

      - name: Show hardware
        run: |
          echo "===== CPU ====="
          nproc

          echo "===== MEMORY ====="
          free -h

          echo "===== BLENDER ====="
          blender --version

          echo "===== FFMPEG ====="
          ffmpeg -version | head -1

      - name: Create output directory
        run: |
          mkdir -p output
          mkdir -p /home/runner/work/render_frames

      - name: Test Blender
        run: |
          blender --background --version

      - name: Render video
        run: |
          blender -b \
            --python render.py \
            -- \
            --output /home/runner/work/rendered_video.mp4 \
            --frames 1-120

      - name: Check rendered video
        run: |
          if [ ! -f "/home/runner/work/rendered_video.mp4" ]; then
            echo "ERROR: Rendered video was not created."
            exit 1
          fi

          echo "===== VIDEO ====="
          ls -lh /home/runner/work/rendered_video.mp4

          echo "===== VIDEO INFO ====="
          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            /home/runner/work/rendered_video.mp4

      - name: Move final video
        run: |
          cp \
            /home/runner/work/rendered_video.mp4 \
            output/final_video.mp4

          echo "Final video:"
          ls -lh output/final_video.mp4

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: final-low-poly-video
          path: output/final_video.mp4
          retention-days: 7
